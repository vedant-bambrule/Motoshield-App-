name: motoshield
description: "MOTOSHIELD - AI-driven motorcycle safety and rider assistance app."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.1.0

  # Firebase — auth, database, push notifications
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # Real sensors + location for crash detection
  sensors_plus: ^6.1.1
  geolocator: ^13.0.1
  permission_handler: ^11.3.1

  # Free map (OpenStreetMap) instead of Google Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
